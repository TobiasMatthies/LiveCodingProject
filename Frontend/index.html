<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellapp</title>

    <link rel="stylesheet" href="styles/style.css">

    <script src="scripts/db.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/templates.js"></script>
</head>

<body onload="init()">
    <header>
        <span class="brand">🍔 Bestellapp</span>
        <span class="tagline">Frisch bestellt, schnell geliefert</span>
    </header>
    <main>
        <section class="meals-section">
            <h1>Gerichte</h1>

            <div id="meals">

            </div>
        </section>
        <div class="basket" id="basket">
            <h3>Deine Gerichte</h3>
            <div id="basket-meals"></div>
            <div class="basket-summary">
                <p><span>Zwischensumme</span><span><span id="subtotal">0</span>$</span></p>
                <p><span>Lieferkosten</span><span>5$</span></p>
                <p class="total-row"><span>Gesamt</span><span><span id="total">0</span>$</span></p>
            </div>
            <button class="order-button" onclick="order()">Bestellen</button>
        </div>
    </main>
</body>

</html>
